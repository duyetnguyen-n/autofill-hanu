services:
  app:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    restart: unless-stopped
    env_file: ../../.env.cloud
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      HANU_CLOUD_DEV: 0
      TRUST_PROXY: 1
    volumes:
      - ../../secrets:/run/secrets:ro
    networks: [backend]
    # No published application port; only Caddy can reach it.
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: ../../.env.cloud
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on: [app]
volumes:
  caddy_data:
  caddy_config:
networks:
  backend:
