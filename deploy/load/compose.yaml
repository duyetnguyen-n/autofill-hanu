# No production env files, public database ports, or persistent volumes.
services:
  load-db:
    image: postgres:17
    environment:
      POSTGRES_USER: load_test
      POSTGRES_PASSWORD: synthetic_test_only
      POSTGRES_DB: hanu_load_test
    tmpfs:
      - /var/lib/postgresql/data
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U load_test -d hanu_load_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [load-only]
  load-server:
    build:
      context: ../..
      dockerfile: deploy/load/Dockerfile
    cpus: ${HANU_LOAD_CPUS:-0.1}
    mem_limit: 512m
    memswap_limit: 512m
    ports: ["127.0.0.1:${HANU_LOAD_PORT:-33001}:3000"]
    environment:
      HANU_LOAD_TEST_KEY: ${HANU_LOAD_TEST_KEY:?A random fixture key is required}
      HANU_LOAD_USERS: ${HANU_LOAD_USERS:-10}
      HANU_LOAD_ORIGIN: http://127.0.0.1:${HANU_LOAD_PORT:-33001}
      HANU_LOAD_DATABASE_URL: postgresql://load_test:synthetic_test_only@load-db:5432/hanu_load_test
      HANU_LOAD_DB_DELAY_MS: ${HANU_LOAD_DB_DELAY_MS:-0}
    depends_on:
      load-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz',{headers:{Host:new URL(process.env.HANU_LOAD_ORIGIN).host}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [load-only]
networks:
  load-only: {internal: true}
